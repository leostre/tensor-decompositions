[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdecomp"
version = "0.2.4"
description = "Library for tensor and matrix decompositions applications"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}  # Updated license format
authors = [
    {name = "Leon Strelkov", email = "strelllleo@mail.ru"}
]
keywords = ["tensor decompositions", "matrix decompositions", "randomized algorithms"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "matplotlib>=3.7.5",
    "tensorflow>=2.13.1",
    "tensorly",  # Fixed: removed invalid wildcard
    "torch",     # Fixed: removed invalid wildcard
]

[project.urls]
Homepage = "https://github.com/leostre/tensor-decompositions.git"

# If you want to include both packages, use:
# packages = ["tdecomp", "experiments"]

# Alternative: use find to automatically discover packages
[tool.setuptools.packages.find]
include = ["tdecomp*"]  # Include tdecomp and all subpackages
exclude = ["tests*", "experiments*"]  # Exclude test/experiment packages

[dependency-groups]
experiments = [
    "accelerate>=1.0.1",
    "datasets>=3.1.0",
    "evaluate>=0.4.6",
    "ipykernel>=6.29.5",
    "mlflow[auth]>=2.17.2",
    "nvidia-ml-py>=13.590.48",
    "scikit-learn>=1.3.2",
    "transformers>=4.46.3",
]
